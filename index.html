<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flota MSMIN</title>
<meta name="theme-color" content="#1f3f95">
<title>Flota MSMIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: barra superior con pestañas por rol; conductor ve solo el check, admin ve panel one-page (KPIs > gráficos > tabla) y gestión de vehículos. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --surface-2:#f1f4fa; --line:#d6deeb; --fg:#14213d; --muted:#56627a;
  --accent:#1f3f95; --accent-fg:#ffffff; --accent-soft:#e3eafa; --heading:#1f3f95;
  --orange:#e8571e; --orange-soft:#fde9df; --on-sem:#ffffff;
  --ok:#2f7d4f; --ok-soft:#e1f1e7; --warn:#a86a00; --warn-soft:#fbefd6; --crit:#c0322b; --crit-soft:#fbe3e1; --none:#7d8891; --none-soft:#eceff1;
  --plate-bg:#ffffff; --plate-fg:#101418; --plate-line:#101418;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1630; --surface:#13204a; --surface-2:#1a2a5a; --line:#2a3b70; --fg:#eaf0fb; --muted:#9fb0d0;
  --accent:#6f95f0; --accent-fg:#0c1630; --accent-soft:#1e3170; --heading:#ffffff;
  --orange:#ff7a3d; --orange-soft:#47230f; --on-sem:#0c1630;
  --ok:#5cc187; --ok-soft:#173326; --warn:#e8b04a; --warn-soft:#3a2d12; --crit:#f07068; --crit-soft:#3d1c1a; --none:#8995a0; --none-soft:#252f36;
  --plate-bg:#e9ecee; --plate-fg:#101418; --plate-line:#101418; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1630; --surface:#13204a; --surface-2:#1a2a5a; --line:#2a3b70; --fg:#eaf0fb; --muted:#9fb0d0;
  --accent:#6f95f0; --accent-fg:#0c1630; --accent-soft:#1e3170; --heading:#ffffff;
  --orange:#ff7a3d; --orange-soft:#47230f; --on-sem:#0c1630;
  --ok:#5cc187; --ok-soft:#173326; --warn:#e8b04a; --warn-soft:#3a2d12; --crit:#f07068; --crit-soft:#3d1c1a; --none:#8995a0; --none-soft:#252f36;
  --plate-bg:#e9ecee; --plate-fg:#101418; --plate-line:#101418; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.35rem;color:var(--heading)} .dash-h h1{color:var(--heading)} h3{font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.sec-h h3{color:var(--heading);display:flex;align-items:center;gap:8px}
.sec-h h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--orange)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--orange)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.logo-msmin{background:#fff;border-radius:6px;padding:4px 8px;display:inline-flex;line-height:0}
.logo-msmin img{height:30px;width:auto;max-width:none}
.brand-t{color:var(--muted);font-size:.85rem;font-weight:600;padding-left:10px;border-left:1px solid var(--line)}
.logo-cli{display:inline-flex;align-items:center;gap:6px;margin-left:4px}
.logo-cli small{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.logo-cli img{height:30px;width:auto;border-radius:4px}
@media (max-width:520px){.brand-t{display:none}.logo-msmin img{height:26px}.logo-cli img{height:26px}}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab:hover{background:var(--surface-2);color:var(--fg)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.who{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.who img{width:24px;height:24px;border-radius:50%}
.role{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:4px;background:var(--orange-soft);color:var(--orange);font-weight:700}

main{padding-block:20px 60px}
.view{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.notice{padding:12px 14px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}
.notice.err{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.notice.good{background:var(--ok-soft);border-color:transparent;color:var(--ok)}

/* Plate */
.plate{display:inline-flex;align-items:center;gap:0;font-family:var(--f-mono);font-weight:700;font-size:.86rem;letter-spacing:.06em;background:var(--plate-bg);color:var(--plate-fg);border:1.5px solid var(--plate-line);border-radius:4px;padding:1px 7px 1px 5px;white-space:nowrap}
.plate::before{content:"";width:3px;height:12px;background:#1f4fa3;margin-right:6px;border-radius:1px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)}
.c-crit{background:var(--crit-soft);color:var(--crit)} .c-none{background:var(--none-soft);color:var(--none)}

/* Form */
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{font-weight:500;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:15px}
textarea{resize:vertical;min-height:80px}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:6px;background:var(--surface-2);border:1px solid transparent}
.item.need{border-color:var(--warn)}
.item .lbl{font-weight:600;min-width:0}
.item .lbl small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-shrink:0}
.seg button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted);min-width:52px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].s-ok{background:var(--ok);color:var(--on-sem)}
.seg button[aria-pressed="true"].s-malo{background:var(--warn);color:var(--on-sem)}
.seg button[aria-pressed="true"].s-falta{background:var(--crit);color:var(--on-sem)}
.seg button[aria-pressed="true"].s-na{background:var(--none);color:var(--on-sem)}
.seg button[aria-pressed="true"].s-yn{background:var(--accent);color:var(--accent-fg)}
.fat{display:flex;flex-direction:column;gap:8px}
.item.fq .lbl{font-weight:500;font-size:.92rem}
.firma{display:block;width:100%;max-width:560px;aspect-ratio:72/22;background:#fff;border:1.5px dashed var(--line);border-radius:6px;touch-action:none;cursor:crosshair}
.firma.need{border-color:var(--warn)}
.firma-box{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px;max-width:380px}
.firma-box img{display:block;width:100%}
.form-foot{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.progress{font-size:.85rem;color:var(--muted);margin-right:auto}

/* Dashboard */
.dash-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.dash-h h1{font-size:2rem;line-height:1}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--none);cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--muted)}
.kpi.k-crit{border-top-color:var(--crit)} .kpi.k-warn{border-top-color:var(--warn)} .kpi.k-ok{border-top-color:var(--ok)} .kpi.k-acc{border-top-color:var(--orange)}
.kpi .k-l{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .k-v{font-family:var(--f-display);font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:.82rem;color:var(--muted)}
.kpi .k-s b{color:var(--warn)}
.row3{display:grid;grid-template-columns:1fr 1.25fr 1.25fr;gap:12px}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.stack div{height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.85rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.big-split{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.big-split div{display:flex;flex-direction:column}
.big-split b{font-family:var(--f-display);font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-r{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;font-size:.88rem;cursor:pointer}
.bar-t{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar-t div{height:100%;background:var(--crit);border-radius:3px}
.bar-r b{text-align:right;font-variant-numeric:tabular-nums}
.upcoming{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow:auto}
.up{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:.88rem;padding:5px 0;border-bottom:1px dashed var(--line)}
.up:last-child{border-bottom:0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
.cell2{display:flex;flex-direction:column;gap:2px}
.cell2 small{color:var(--muted);font-size:.75rem}
.kmbar{width:90px;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:3px}
.kmbar div{height:100%}
.seg-f{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg-f button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted)}
.seg-f button+button{border-left:1px solid var(--line)}
.seg-f button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.recent{display:flex;flex-direction:column}
.rc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.rc:last-child{border-bottom:0}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--surface-2);border-radius:6px;padding:9px 10px;display:flex;flex-direction:column;gap:3px}
.kv small{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.chk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.chk-list div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;padding:5px 8px;border-radius:5px;background:var(--surface-2)}

/* Vehicles admin */
.veh-list{display:flex;flex-direction:column}
.veh{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.veh:last-child{border-bottom:0}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:start}
.people{display:flex;flex-direction:column;gap:6px}
.person{display:flex;align-items:center;gap:8px;font-size:.9rem}
.person img{width:22px;height:22px;border-radius:50%}
.hits{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;margin-top:4px}
.hits button{border:0;background:var(--surface);padding:8px 10px;text-align:left;cursor:pointer;display:flex;gap:8px;align-items:center}
.hits button:hover{background:var(--surface-2)}
.login{display:grid;place-items:center;padding-block:40px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.rc.rc-pdf{grid-template-columns:auto 1fr auto auto}
.login form{width:min(400px,100%);display:flex;flex-direction:column;gap:14px;padding:24px}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.who .btn{padding:4px 9px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:30;font-weight:600;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:1.3rem;margin-bottom:4px}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.row3{grid-template-columns:1fr 1fr}.row3>:first-child{grid-column:1/-1}}
@media (max-width:720px){
  .top{position:static} body::before{display:none}
  .top .wrap{gap:8px 12px;padding-block:8px}
  .who img,.who span:not(.role){display:none}
  .tab{padding:7px 11px}
  .item,.item.fq{flex-direction:column;align-items:stretch;gap:8px}
  .seg{display:flex} .seg button{flex:1;padding:11px 6px;font-size:.9rem}
  .items{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis>:last-child{grid-column:1/-1}.row3,.two{grid-template-columns:1fr}.bar-r{grid-template-columns:110px 1fr 30px}.item{flex-wrap:wrap}.dash-h h1{font-size:1.6rem}}
@media (prefers-reduced-motion:no-preference){.kpi,.btn,.tab{transition:border-color .15s,background .15s}}
</style>
</head>

function todosRegistros() { return S.checks.slice(); }

function estadoVehiculo(v, regsPorPat) {
  const regs = (regsPorPat[v.patente] || []);
  const ult = regs[0] || null;
  const kmChecks = regs.reduce((m, r) => Math.max(m, +r.km || 0), 0);
  const km = Math.max(+v.kmActual || 0, kmChecks);
  const res = { v, ult, km, alertas: [] };

  const fechaEst = (d, nombre) => {
    if (d == null) return { cls: "none", txt: "Sin fecha", n: 0 };
    if (d < 0) { res.alertas.push(nombre + " vencida"); return { cls: "crit", txt: `Vencida hace ${-d} d`, n: 2 }; }
    if (d <= AVISO_DIAS) { res.alertas.push(nombre + " por vencer"); return { cls: "warn", txt: `Vence en ${d} d`, n: 1 }; }
    return { cls: "ok", txt: `${d} d`, n: 0 };
  };
  res.rt = fechaEst(dias(v.venceRevTec), "Revisión técnica"); res.rtFecha = v.venceRevTec;
  res.pc = fechaEst(dias(v.vencePermiso), "Permiso de circulación"); res.pcFecha = v.vencePermiso;
  const extF = (ult && ult.extintorVence) || v.venceExtintor;
  res.ext = fechaEst(dias(extF), "Extintor"); res.extFecha = extF;

  const intervalo = +v.intervaloKm || 10000;
  // Próxima mantención: datos del vehículo; si no hay, el "KM Mant." que anotó el conductor.
  const proxV = (v.kmUltimaMant == null || v.kmUltimaMant === "") ? null : +v.kmUltimaMant + intervalo;
  const proxC = ult && +ult.kmMant > 0 ? +ult.kmMant : null;
  const proxKm = proxV ?? proxC;
  if (proxKm == null) {
    res.mant = { cls: "none", txt: "Sin dato", n: 0, rest: null, pct: 0 };
  } else {
    const prox = proxKm, rest = prox - km;
    const pct = Math.max(0, Math.min(1, 1 - rest / intervalo));
    if (rest < 0) { res.mant = { cls: "crit", txt: `Pasada ${nf(-rest)} km`, n: 2, rest, pct: 1, prox }; res.alertas.push("Mantención vencida"); }
    else if (rest <= AVISO_KM) { res.mant = { cls: "warn", txt: `Faltan ${nf(rest)} km`, n: 1, rest, pct, prox }; res.alertas.push("Mantención próxima"); }
    else res.mant = { cls: "ok", txt: `Faltan ${nf(rest)} km`, n: 0, rest, pct, prox };
  }

  const itemEst = (k, nombre) => {
    if (!ult) return { cls: "none", txt: "Sin check", n: 0 };
    const s = ult.items && ult.items[k];
    if (s === "falta") { res.alertas.push("Sin " + nombre.toLowerCase()); return { cls: "crit", txt: "Falta", n: 2 }; }
    if (s === "malo") { res.alertas.push(nombre + " en mal estado"); return { cls: "crit", txt: "Malo", n: 2 }; }
    if (s === "ok") return { cls: "ok", txt: "OK", n: 0 };
    if (s === "na") return { cls: "none", txt: "N/A", n: 0 };
    return { cls: "none", txt: "—", n: 0 };
  };
  res.baliza = itemEst("baliza", "Baliza");
  res.pertiga = itemEst("pertiga", "Pértiga");
  res.repuesto = itemEst("neumatico_repuesto", "Neumático de repuesto");
  if (!ult) res.luces = { cls: "none", txt: "Sin check", n: 0, malas: [] };
  else {
    const malas = LUCES.filter(k => ult.items && ult.items[k] === "malo");
    if (malas.length) { res.luces = { cls: "crit", txt: `${malas.length} mala${malas.length > 1 ? "s" : ""}`, n: 2, malas }; res.alertas.push("Luces malas"); }
    else res.luces = { cls: "ok", txt: "OK", n: 0, malas };
  }
  const otrosMalos = ult ? Object.entries(ult.items || {}).filter(([k, s]) => esFalla(s) && !LUCES.includes(k) && !["baliza","pertiga","neumatico_repuesto"].includes(k)).map(([k]) => k) : [];
  res.otros = otrosMalos;
  const edad = ult ? Math.floor((Date.now() - new Date(ult.fecha)) / 864e5) : null;
  res.chk = !ult ? { cls: "warn", txt: "Nunca", n: 1 } : edad > CHECK_VIEJO_DIAS ? { cls: "warn", txt: `Hace ${edad} d`, n: 1 } : { cls: "ok", txt: edad === 0 ? "Hoy" : `Hace ${edad} d`, n: 0 };
  const peor = Math.max(res.rt.n, res.pc.n, res.ext.n, res.mant.n, res.baliza.n, res.pertiga.n, res.repuesto.n, res.luces.n, otrosMalos.length ? 1 : 0);
  res.global = peor === 2 ? "crit" : peor === 1 ? "warn" : "ok";
  return res;
}
function calcularFlota() {
  const porPat = {};
  for (const r of todosRegistros()) (porPat[r.patente] ||= []).push(r);
  for (const k in porPat) porPat[k].sort((a, b) => b.fecha.localeCompare(a.fecha));
  return { lista: Object.values(S.flota).sort((a, b) => a.patente.localeCompare(b.patente)).map(v => estadoVehiculo(v, porPat)), porPat };
}

function initFirma() {

  const fin = () => { if (!dibujando) return; dibujando = false; S.draft.firma = firmaPNG(c); c.classList.remove("need"); };
  c.addEventListener("pointerup", fin); c.addEventListener("pointercancel", fin);

function firmaPNG(c) {

async function enviarCheck() {
  syncDraft();
  const d = S.draft;
  d.conductor = d.conductor.trim(); d.sap = d.sap.trim(); d.obs = d.obs.trim();
  const faltan = ALL_ITEMS.filter(i => !d.items[i[0]]).length + FATIGA.filter(q => !d.fatiga[q[0]]).length;
  const errs = [];
  if (!d.conductor) errs.push("escribe tu nombre");
  if (!d.patente) errs.push("selecciona la patente");
  if (!d.km || +d.km <= 0) errs.push("ingresa el KM actual");
  if (d.combustible === "" || +d.combustible < 0 || +d.combustible > 100) errs.push("indica el nivel de combustible (0 a 100 %)");
  if (faltan) errs.push(`responde ${faltan} ítem${faltan > 1 ? "s" : ""} pendiente${faltan > 1 ? "s" : ""} (marcados en amarillo)`);
  if (!d.firma) errs.push("firma el check");
  const v = S.flota[d.patente];
  if (!errs.length && v && v.kmActual && +d.km < +v.kmActual) errs.push(`el KM actual es menor al último registrado (${nf(v.kmActual)} km); corrígelo`);
  if (errs.length) { d._try = true; render(); $("#formErr").innerHTML = `<div class="notice err">Para enviar: ${esc(errs.join(", "))}.</div>`; return; }
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const reg = { id, patente: d.patente, km: Math.round(+d.km), kmMant: d.kmMant ? Math.round(+d.kmMant) : null, combustible: Math.round(+d.combustible),
    conductor: d.conductor, sap: d.sap, fecha: new Date().toISOString(), items: { ...d.items }, fatiga: { ...d.fatiga },
    fatigaAlerta: alertaFatiga(d.fatiga), extintorVence: d.extintorVence || null, obs: d.obs || "", firma: true };
  const btn = $("#checkForm button[type=submit]"); btn.disabled = true; btn.textContent = "Enviando…";
  try {
    const guardado = await api("guardarCheck", reg, d.firma);
    S.checks = [guardado, ...S.checks];
    if (S.flota[guardado.patente] && guardado.km > (S.flota[guardado.patente].kmActual || 0)) S.flota[guardado.patente].kmActual = guardado.km;
    reg.fecha = guardado.fecha; reg.id = guardado.id; FIRMAS[guardado.id] = d.firma;
    lsSet("msmin.patente", d.patente); lsSet("msmin.conductor", d.conductor); lsSet("msmin.sap", d.sap);
    S.sent = reg; S.draft = null; render(); window.scrollTo(0, 0);
  } catch (e) {
    btn.disabled = false; btn.textContent = "Enviar check";
    const f = $("#formErr"); if (f) f.innerHTML = `<div class="notice err">No se pudo guardar el check: ${esc(e.message)}. Revisa tu conexión e inténtalo de nuevo.</div>`;
  }
}

function cargarJsPDF() {
  if (window.jspdf) return Promise.resolve(window.jspdf);
  return pdfLib ||= new Promise((ok, err) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js";
    s.onload = () => ok(window.jspdf); s.onerror = () => { pdfLib = null; err(new Error("No se pudo cargar el generador de PDF")); };

}

async function importar() {

    m = /^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/.exec(s); return m ? `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}` : null; };

  for (const line of raw) {

    const pat = normPat(c[0]);
    if (pat.length < 5 || /^PATENTE/.test(pat)) { if (!/^PATENTE/.test(pat)) bad.push(line); continue; }
    const prev = S.flota[pat] || {};
    const doc = { ...prev, patente: pat, marca: c[1] || prev.marca || "", modelo: c[2] || prev.modelo || "", faena: c[3] || prev.faena || "",
      kmActual: n(c[4]) ?? prev.kmActual ?? null, kmUltimaMant: n(c[5]) ?? prev.kmUltimaMant ?? null, intervaloKm: prev.intervaloKm || 10000,
      venceRevTec: fecha(c[6]) || prev.venceRevTec || null, venceExtintor: fecha(c[7]) || prev.venceExtintor || null, interno: c[8] || prev.interno || "", vencePermiso: fecha(c[9]) || prev.vencePermiso || null, anio: prev.anio ?? null };
    lista.push(doc);
  }
  if (lista.length) {
    msg.innerHTML = `<div class="notice">Importando ${lista.length} camioneta(s)…</div>`;
    try { const r = await api("importarVehiculos", lista); ok = r.ok; S.flota = r.flota; } catch (e) { msg.innerHTML = `<div class="notice err">${esc(e.message)}</div>`; return; }
  }
  msg.innerHTML = `<div class="notice ${bad.length ? "err" : "good"}">${ok} camioneta${ok !== 1 ? "s" : ""} importada${ok !== 1 ? "s" : ""}.${bad.length ? ` No se pudieron leer ${bad.length} fila(s): ${esc(bad.slice(0, 3).join(" | "))}` : ""}</div>`;
  const txt = $("#bulk").value; render(); const b2 = $("#bulk"); if (b2) b2.value = (ok && !bad.length) ? "" : txt;
  const m2 = $("#bulkMsg"); if (m2) m2.innerHTML = `<div class="notice ${bad.length ? "err" : "good"}">${ok} camioneta${ok !== 1 ? "s" : ""} importada${ok !== 1 ? "s" : ""}.${bad.length ? ` No se pudieron leer ${bad.length} fila(s): ${esc(bad.slice(0, 3).join(" | "))}` : ""}</div>`;
}

document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-tab],[data-item],[data-fat],[data-act],[data-foco],[data-estado],[data-veh],[data-auth]");
  if (!t) return;
  if (t.dataset.auth) { S.authModo = t.dataset.auth; S.authAviso = null; render(); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; lsSet("msmin.tab", S.tab); S.editUser = null; S.drawer = null; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.item) {
    syncDraft(); S.draft.items[t.dataset.item] = t.dataset.val;
    t.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === t));
    t.closest(".item").classList.remove("need");
    actualizarProgreso(); return;
  }
  if (t.dataset.fat) {
    syncDraft(); S.draft.fatiga[t.dataset.fat] = t.dataset.val;
    t.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === t));
    t.closest(".item").classList.remove("need"); actualizarProgreso(); return;
  }
  if (t.dataset.foco !== undefined && !t.dataset.act) { S.filtro.foco = S.filtro.foco === t.dataset.foco ? "" : t.dataset.foco; render(); return; }
  if (t.dataset.estado) { S.filtro.estado = t.dataset.estado; render(); return; }
  if (t.dataset.veh && !t.dataset.act) { S.drawer = t.dataset.veh; renderOverlay(); return; }
  const a = t.dataset.act;
  if (a === "todo-ok") { syncDraft(); const sec = SECCIONES.find(s => s.id === t.dataset.sec); sec.items.forEach(([k]) => S.draft.items[k] = "ok"); render(); }
  else if (a === "borrar-firma") { if (S.draft) S.draft.firma = null; const c = $("#firma"); if (c) c.getContext("2d").clearRect(0, 0, c.width, c.height); }
  else if (a === "nuevo-check") { S.sent = null; S.draft = nuevoDraft(); render(); }
  else if (a === "cerrar") { S.drawer = null; renderOverlay(); }
  else if (a === "refrescar") { await cargar(); toast("Datos actualizados"); }
  else if (a === "salir") cerrarSesion();
  else if (a === "csv") exportarExcel();
  else if (a === "pdf-enviado") descargarPDF(S.sent && { ...S.sent, firmaData: FIRMAS[S.sent.id] });
  else if (a === "pdf") descargarPDF(S.checks.find(c => c.id === t.dataset.id));
  else if (a === "mi-clave") { S.tab = "clave"; render(); }
  else if (a === "volver") { elegirTab(true); render(); }
  else if (a === "editar-user") { S.editUser = t.dataset.u; render(); window.scrollTo(0, 0); }
  else if (a === "nuevo-user") { S.editUser = null; render(); }
  else if (a === "editar-veh") { S.editVeh = t.dataset.pat; S.drawer = null; S.confirmDel = null; S.tab = "vehiculos"; render(); window.scrollTo(0, 0); }
  else if (a === "nuevo-veh") { S.editVeh = null; render(); }
  else if (a === "borrar-veh") {
    if (S.confirmDel !== t.dataset.pat) { S.confirmDel = t.dataset.pat; render(); return; }
    try { S.flota = await api("eliminarVehiculo", t.dataset.pat); toast(`${showPat(t.dataset.pat)} eliminada`); S.editVeh = null; S.confirmDel = null; render(); } catch (e) { toast("No se pudo eliminar: " + e.message); }
  }
  else if (a === "bulk") importar();
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && S.drawer) { S.drawer = null; renderOverlay(); }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches(".bar-r")) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  if (ev.target.id === "checkForm") enviarCheck();
  if (ev.target.id === "vehForm") guardarVeh();
  if (ev.target.id === "loginForm") ingresar();
  if (ev.target.id === "claveForm") guardarClave();
  if (ev.target.id === "userForm") guardarUser();
});
document.addEventListener("input", async ev => {
  const id = ev.target.id;
  if (id === "flt-q") { S.filtro.q = ev.target.value; clearTimeout(S._qt); S._qt = setTimeout(() => { render(); const i = $("#flt-q"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "flt-faena") { S.filtro.faena = ev.target.value; render(); }
  if (ev.target.id === "f-patente") { syncDraft(); render(); }
});
function actualizarProgreso() {
  const d = S.draft, p = $(".progress"); if (!d || !p) return;
  const resp = ALL_ITEMS.filter(i => d.items[i[0]]).length + FATIGA.filter(q => d.fatiga[q[0]]).length;
  p.textContent = `${resp} de ${ALL_ITEMS.length + FATIGA.length} respuestas`;
}
function syncDraft() {
  if (!S.draft || !$("#checkForm")) return;
  S.draft.patente = $("#f-patente").value; S.draft.km = $("#f-km").value; S.draft.conductor = $("#f-conductor").value;
  S.draft.sap = $("#f-sap").value; S.draft.kmMant = $("#f-kmmant").value; S.draft.combustible = $("#f-comb").value;
  S.draft.extintorVence = $("#f-ext").value; S.draft.obs = $("#f-obs").value;
}

// ---------- Arranque ----------
function elegirTab(forzar) {
  const tabs = tabsDisponibles().map(t => t[0]);
  if (forzar || !tabs.includes(S.tab)) {
    const pref = lsGet("msmin.tab");
    S.tab = tabs.includes(pref) ? pref : tabs[0];
  }
}
function softRender() {
  // Evita borrar lo que el conductor está escribiendo
  if (S.tab === "check" && $("#checkForm")) { syncDraft(); }
  const f = document.activeElement && document.activeElement.id;
  render();
  if (f && f !== "flt-q") { const el = document.getElementById(f); if (el && el.focus) el.focus(); }
}
function start() {
  // Enlaces que llegan por correo (recuperar clave o confirmar cuenta)
  const h = new URLSearchParams(location.hash.slice(1));
  const vieneDeEnlace = h.has("access_token");
  if (h.get("type") === "recovery") S.authModo = "nueva";
  if (h.has("error_code") || h.has("error")) {
    S.authModo = "olvido";
    S.authAviso = { err: true, txt: /expired|invalid/i.test(h.get("error_code") + h.get("error_description")) ? "El enlace expiró o ya fue usado. Pide uno nuevo aquí." : (h.get("error_description") || "El enlace no es válido.") };
    history.replaceState(null, "", URL_APP);
  }
  sb.auth.onAuthStateChange(ev => {
    if (ev === "PASSWORD_RECOVERY") { S.authModo = "nueva"; S.token = null; render(); }
    else if (ev === "SIGNED_IN" && vieneDeEnlace && !S.token && S.authModo !== "nueva") { S.token = "sb"; S.flotaReady = false; render(); cargar(); }
  });
  S.token = lsGet("msmin.auth") && S.authModo !== "nueva" ? "sb" : null;
  if (S.token) { S.flotaReady = false; render(); cargar(); } else render();
  // El panel se refresca solo cada 2 minutos para ver los checks nuevos
  setInterval(() => { if (S.admin && S.tab === "panel" && !S.drawer && document.visibilityState === "visible") cargar(true); }, 120000);
}
start();
})();
</script>
